<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>接龍記牌小工具 (最大記憶：200 步)</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#282c34">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="記牌工具">
  <link rel="apple-touch-icon" href=""> 
  
  <style>
    /* ========== 鎖定背景與修正置中方式 ========== */
    body { 
      font-family: 'Microsoft JhengHei', Arial, sans-serif; 
      background: #282c34; 
      color: #f0f0f0; 
      margin: 0; 
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* 動態高度，確保不會被瀏覽器網址列吃掉 */
      overflow: hidden; /* 防止任何捲動與滑動 */
      touch-action: none; 
      position: relative; /* 提供絕對定位的基準 */
    }
    
    /* ========== 自動等比例縮放的容器 (改用絕對定位置中) ========== */
    #app-container {
      width: 740px;  
      height: 580px; /* 稍微加高，確保內部元件不會擁擠被切到 */
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: center center;
      text-align: center;
      font-size: 18px; 
      /* 預設先置中，稍後會被 JS 覆蓋加上 scale */
      transform: translate(-50%, -50%) scale(1);
    }

    /* ----- 以下完全保留你原本的 CSS 樣式 ----- */
    h2 {
      color: #61dafb; 
      margin-top: 10px;
      margin-bottom: 15px;
    }
    
    button { 
      font-size: 20px;  
      margin: 4px; 
      padding: 8px 12px; 
      border-radius: 6px; 
      cursor: pointer;
      border: 1px solid #555; 
      background: #3a3f47; 
      color: #f0f0f0;
      min-width: 40px; 
      transition: background-color 0.2s;
      touch-action: manipulation;
    }
    button:hover { background-color: #4c525d; }

    .red-text-suit { color: #e74c3c !important; }

    .suit-group button.selected,
    .rank-group button.selected { 
        background: #61dafb; 
        color: #1e1e1e !important; 
        border: 1px solid #61dafb;
        box-shadow: 0 0 5px #61dafb;
    }

    .suit-icon { font-size: 28px; color: inherit; }
    .red-text-suit .suit-icon { color: #e74c3c !important; }

    .top-alignment-wrapper {
        max-width: 643px; 
        margin: 10px auto; 
    }
    .top-selection {
        display: flex;
        justify-content: space-between;
        align-items: center; 
        width: 100%; 
    }
    .top-left-col {
        width: 105px; 
        box-sizing: border-box; 
        display: flex;
        justify-content: flex-start; 
        padding-right: 15px;
    }
    .top-right-spacer { width: 105px; height: 1px; flex-shrink: 0; }

    .clear-all { 
      width: 90px; 
      background: #e74c3c; 
      box-shadow: 0 3px 0 #c0392b;
      font-size: 16px; 
      display: flex;
      flex-direction: column; 
      align-items: center;
      padding: 8px 8px; 
      margin: 0; 
      flex-shrink: 0; 
    }
    .clear-all .clear-icon { font-size: 24px; margin-right: 0; margin-bottom: 2px; }
    .clear-all:hover { background: #c0392b; transform: translateY(1px); box-shadow: 0 2px 0 #a03020; }

    .selection-area {
        display: flex;
        align-items: center; 
        width: 433px; 
        justify-content: flex-start; 
        flex-shrink: 1; 
    }

    .suit-group {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 1px; 
      margin-right: 8px; 
    }
    .suit-group button { padding: 10px 10px; min-width: 50px; }

    .rank-group {
      display: flex;
      flex-direction: column;
      margin-right: -70px; 
      flex-shrink: 0;
    }
    .rank-row { 
      display: flex;
      flex-wrap: nowrap;
      justify-content: flex-start;
      margin: 0;
      padding: 0;
    }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(6, 68px); 
      gap: 5px; 
      justify-content: center; 
      max-width: 510px; 
      padding: 5px;
      background: #3a3f47;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5); 
    }
    
    .slot { 
      width: 68px;  
      height: 50px; 
      font-size: 24px;  
      border: 3px solid #555; 
      border-radius: 8px;
      background: #1e1e1e;
      color: #f0f0f0; 
      margin: 0; 
      display: flex; 
      align-items: center;
      justify-content: center;
      font-weight: bold;
      touch-action: manipulation;
    }
    .slot[style*="color: red"] { color: #ff6b6b !important; }

    .main-area {
      display: flex;
      justify-content: center;
      align-items: flex-start; 
      margin: 10px auto;
      max-width: 720px; 
    }
    
    .left-sidebar-buttons { display: flex; flex-direction: column; width: 90px; margin-right: 15px; padding-top: 5px; }
    .right-sidebar-buttons { display: flex; flex-direction: column; width: 90px; margin-left: 15px; padding-top: 5px; }

    .clear-button { 
      font-size: 16px; 
      padding: 8px 8px; 
      margin: 5px 0;
      border-radius: 6px;
      color: white; 
      border: none;
      width: 90px; 
      display: flex;
      flex-direction: column; 
      align-items: center;
    }
    .clear-icon { font-size: 24px; margin-bottom: 2px; }
    
    .bookmark-button { background: #f1c40f; box-shadow: 0 3px 0 #d1ac0d; color: #333; }
    .bookmark-button:hover { background: #d1ac0d; transform: translateY(1px); box-shadow: 0 2px 0 #b3910c; }
    .bookmark-button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; background: #555 !important; }

    .clear-empty { background: #2ecc71; box-shadow: 0 3px 0 #27ae60; }
    .clear-empty:hover { background: #27ae60; transform: translateY(1px); box-shadow: 0 2px 0 #219d55; }

    .undo-button { background: #3498db; box-shadow: 0 3px 0 #2980b9; }
    .undo-button:hover { background: #2980b9; transform: translateY(1px); box-shadow: 0 2px 0 #2071a1; }
    
    .redo-button { background: #1abc9c; box-shadow: 0 3px 0 #16a085; }
    .redo-button:hover { background: #16a085; transform: translateY(1px); box-shadow: 0 2px 0 #148f77; }
  </style>
</head>
<body>

  <!-- 用來自動縮放的包裝容器 -->
  <div id="app-container">
      <h2>接龍記牌小工具 (最大記憶：200 步)</h2>

      <div class="top-alignment-wrapper">
          <div class="top-selection">
              <div class="top-left-col">
                  <button class="clear-all" onclick="clearAll()">
                      <span class="clear-icon">❌</span>
                      全部清除
                  </button>
              </div>

              <div class="selection-area">
                  <div class="suit-group">
                      <button onclick="selectSuit('♠')"><span class="suit-icon">♠</span></button>
                      <button class="red-text-suit" onclick="selectSuit('♥')"><span class="suit-icon">♥</span></button>
                      <button onclick="selectSuit('♧')"><span class="suit-icon">♧</span></button>
                      <button class="red-text-suit" onclick="selectSuit('♢')"><span class="suit-icon">♢</span></button>
                  </div>

                  <div class="rank-group">
                      <div class="rank-row">
                          <button onclick="selectRank('A')">A</button>
                          <button onclick="selectRank('2')">2</button>
                          <button onclick="selectRank('3')">3</button>
                          <button onclick="selectRank('4')">4</button>
                          <button onclick="selectRank('5')">5</button>
                          <button onclick="selectRank('6')">6</button>
                      </div>
                      <div class="rank-row">
                          <button onclick="selectRank('7')">7</button>
                          <button onclick="selectRank('8')">8</button>
                          <button onclick="selectRank('9')">9</button>
                          <button onclick="selectRank('10')">10</button>
                          <button onclick="selectRank('J')">J</button>
                          <button onclick="selectRank('Q')">Q</button>
                          <button onclick="selectRank('K')">K</button>
                      </div>
                  </div>
              </div>
              <div class="top-right-spacer"></div>
          </div>
      </div>
      
      <div class="main-area">
          <div class="left-sidebar-buttons">
              <button class="clear-button clear-empty" onclick="removeEmptySlots()">
                  <span class="clear-icon">🗑️</span>
                  清除空格
              </button>
              <button class="clear-button undo-button" onclick="undo()">
                  <span class="clear-icon">↶</span>
                  復原
              </button>
              <button class="clear-button redo-button" onclick="redo()">
                  <span class="clear-icon">↱</span>
                  反復原
              </button>
          </div>
          
          <div class="grid" id="slots"></div>

          <div class="right-sidebar-buttons">
              <button class="clear-button bookmark-button" onclick="saveBookmark()">
                  <span class="clear-icon">🔖</span>
                  紀錄
              </button>
              <button class="clear-button bookmark-button" id="loadBookmarkBtn" onclick="loadBookmark()">
                  <span class="clear-icon">🔙</span>
                  返回紀錄
              </button>
          </div>
      </div>
  </div>

  <script>
    // ========== 自動等比例放大 (Zoom) 邏輯 - 修正裁切問題 ==========
    function adjustScale() {
        const container = document.getElementById('app-container');
        const targetWidth = 740;
        const targetHeight = 580;
        
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        
        const scaleX = (screenWidth * 0.98) / targetWidth;
        const scaleY = (screenHeight * 0.98) / targetHeight;
        const scale = Math.min(scaleX, scaleY);
        
        // 使用 translate(-50%, -50%) 強制把畫面定在正中心，再進行 scale 縮放，徹底避免被切邊
        container.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    // 當螢幕翻轉或改變大小時，重新計算縮放
    window.addEventListener('resize', adjustScale);
    
    // 手機翻轉時，加入延遲確保抓到最新的螢幕尺寸 (避免抓到舊的寬高)
    window.addEventListener('orientationchange', () => {
        adjustScale();
        setTimeout(adjustScale, 100);
        setTimeout(adjustScale, 300);
    });
    
    // 初始化執行一次
    adjustScale();


    // ========== 你的原本記牌邏輯 (完全保留) ==========
    let selectedSuit = ''; 
    let selectedRank = '';
    let lastUsedSuit = '';
    let lastUsedRank = '';
    let history = [];
    let redoStack = []; 
    const MAX_HISTORY = 200; 
    let bookmarkState = null; 

    function getCurrentState() {
        const slots = document.querySelectorAll('.slot');
        return {
            slots: Array.from(slots).map(s => ({ content: s.innerText, color: s.style.color })),
            lastUsedSuit: lastUsedSuit,
            lastUsedRank: lastUsedRank
        };
    }

    function clearSelections() {
        selectedSuit = ''; 
        selectedRank = '';
        document.querySelectorAll('.rank-group button').forEach(btn => btn.classList.remove('selected'));
        document.querySelectorAll('.suit-group button').forEach(btn => btn.classList.remove('selected'));
    }

    function loadState(state) {
        const slots = document.querySelectorAll('.slot');
        if (state.slots.length !== slots.length) return; 
        slots.forEach((s, index) => {
            const item = state.slots[index];
            s.innerText = item.content;
            s.style.color = item.color || '#f0f0f0'; 
        });
        lastUsedSuit = state.lastUsedSuit || '';
        lastUsedRank = state.lastUsedRank || '';
        clearSelections(); 
    }

    function saveState() {
        const currentState = getCurrentState();
        if (history.length > 0) {
            const lastState = history[history.length - 1];
            if (JSON.stringify(lastState.slots) === JSON.stringify(currentState.slots) &&
                lastState.lastUsedSuit === currentState.lastUsedSuit &&
                lastState.lastUsedRank === currentState.lastUsedRank) return; 
        }
        if (history.length >= MAX_HISTORY) history.shift(); 
        history.push(currentState);
    }

    function undo() {
        if (history.length <= 1) return;
        const currentState = history.pop(); 
        redoStack.push(currentState);
        loadState(history[history.length - 1]);
    }

    function redo() {
        if (redoStack.length === 0) return;
        const nextState = redoStack.pop();
        loadState(nextState);
        history.push(nextState);
    }

    function updateBookmarkButtons() {
        const loadBtn = document.getElementById('loadBookmarkBtn');
        if (loadBtn) loadBtn.disabled = (bookmarkState === null);
    }

    function saveBookmark() { bookmarkState = getCurrentState(); updateBookmarkButtons(); }

    function loadBookmark() {
        if (bookmarkState === null) return;
        if (redoStack.length > 0) redoStack = []; 
        loadState(bookmarkState);
        saveState(); 
    }

    function selectSuit(suit) {
      document.querySelectorAll('.suit-group button').forEach(btn => btn.classList.remove('selected'));
      selectedSuit = suit;
      document.querySelectorAll('.suit-group button').forEach(btn => {
          if (btn.querySelector('.suit-icon') && btn.querySelector('.suit-icon').innerText.trim() === suit) btn.classList.add('selected');
      });
    }

    function selectRank(rank) {
      document.querySelectorAll('.rank-group button').forEach(btn => btn.classList.remove('selected'));
      selectedRank = rank;
      document.querySelectorAll('.rank-group button').forEach(btn => {
          if (btn.innerText.trim() === rank) btn.classList.add('selected');
      });
    }

    function fillSlot(btn) {
        if (redoStack.length > 0) redoStack = [];
        let suitToUse = selectedSuit;
        let rankToUse = selectedRank;

        if (suitToUse && !rankToUse) rankToUse = lastUsedRank;
        else if (!suitToUse && rankToUse) suitToUse = lastUsedSuit;
        
        const hasValidCardToFill = suitToUse && rankToUse;
        const isSlotFilled = btn.innerText !== '';

        if (!hasValidCardToFill) {
            if (isSlotFilled) { btn.innerText = ''; btn.style.color = '#f0f0f0'; saveState(); }
            return;
        }
        
        btn.innerText = suitToUse + rankToUse;
        btn.style.color = (suitToUse === '♥' || suitToUse === '♢') ? 'red' : '#f0f0f0'; 
        
        lastUsedSuit = suitToUse; lastUsedRank = rankToUse;
        selectedSuit = ''; selectedRank = '';
        saveState();
    }

    function clearAll() {
      if (confirm("確定要清除所有 36 個記牌槽、花色/數字選中狀態以及上次紀錄的延續記憶嗎？")) {
          if (redoStack.length > 0) redoStack = []; 
          document.querySelectorAll('.slot').forEach(s => { s.innerText = ''; s.style.color = '#f0f0f0'; });
          clearSelections(); lastUsedSuit = ''; lastUsedRank = '';
          saveState(); 
      }
    }

    function removeEmptySlots() {
      if (redoStack.length > 0) redoStack = []; 
      const slots = Array.from(document.querySelectorAll('.slot'));
      const nonEmpty = slots.filter(s => s.innerText !== '');
      const slotsContainer = document.getElementById('slots');
      
      slotsContainer.innerHTML = '';
      nonEmpty.forEach(s => slotsContainer.appendChild(s));
      
      for (let i = nonEmpty.length; i < 36; i++) {
        let b = document.createElement('button');
        b.className = 'slot'; b.onclick = () => fillSlot(b);
        slotsContainer.appendChild(b);
      }
      saveState(); 
    }

    const slotsContainer = document.getElementById('slots');
    for (let i = 0; i < 36; i++) {
      let b = document.createElement('button');
      b.className = 'slot'; b.onclick = () => fillSlot(b);
      slotsContainer.appendChild(b);
    }

    window.onload = function() { saveState(); updateBookmarkButtons(); }

    // ========== 註冊 PWA Service Worker ==========
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('ServiceWorker 註冊失敗: ', err));
      });
    }
  </script>

</body>
</html>
