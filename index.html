<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>接龍記牌小工具 (最大記憶：200 步)</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#282c34">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="記牌工具">
  <link rel="apple-touch-icon" href=""> 
  
  <style>
    /* ========== 鎖定背景與修正置中方式 ========== */
    body { 
      font-family: 'Microsoft JhengHei', Arial, sans-serif; 
      background: #282c34; 
      color: #f0f0f0; 
      margin: 0; 
      width: 100vw;
      height: 100vh;
      height: 100dvh; 
      overflow: hidden; 
      touch-action: none; 
      position: relative; 
    }
    
    /* ========== 自動等比例縮放的容器 ========== */
    #app-container {
      width: 960px;  /* 整體版面再加寬，容納更寬的按鍵 */
      height: 480px; /* 【修改點】壓低整體預設高度，讓上下自動產生更多留白 */
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: center center;
      text-align: center;
      font-size: 18px; 
      transform: translate(-50%, -50%) scale(1);
    }
    
    button { 
      font-size: 26px;  
      border-radius: 8px; 
      cursor: pointer;
      border: 1px solid #555; 
      background: #3a3f47; 
      color: #f0f0f0;
      transition: background-color 0.2s;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:hover { background-color: #4c525d; }

    .red-text-suit { color: #e74c3c !important; }

    .suit-group button.selected,
    .rank-group button.selected { 
        background: #61dafb; 
        color: #1e1e1e !important; 
        border: 2px solid #61dafb;
        box-shadow: 0 0 8px #61dafb;
    }

    .suit-icon { font-size: 38px; color: inherit; line-height: 1; }
    .red-text-suit .suit-icon { color: #e74c3c !important; }

    /* ========== 頂端排版 ========== */
    .top-alignment-wrapper {
        max-width: 940px; 
        margin: 0 auto; 
    }
    .top-selection {
        display: flex;
        justify-content: space-between;
        align-items: center; 
        width: 100%; 
    }
    .top-left-col, .top-right-spacer {
        width: 120px; 
        display: flex;
        justify-content: flex-start;
        flex-shrink: 0;
    }

    .clear-all { 
      width: 100px; 
      height: 70px;
      background: #e74c3c; 
      box-shadow: 0 4px 0 #c0392b;
      font-size: 18px; 
      font-weight: bold;
      flex-direction: column; 
      margin: 0; 
    }
    .clear-all .clear-icon { font-size: 28px; margin-bottom: 2px; }
    .clear-all:hover { background: #c0392b; transform: translateY(2px); box-shadow: 0 2px 0 #a03020; }

    .selection-area {
        display: flex;
        align-items: center; 
        justify-content: center; 
        gap: 20px; 
        flex-grow: 1; 
    }

    .suit-group {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 6px; 
    }
    /* 【修改點】花色按鈕：限制高度，只加寬 */
    .suit-group button { 
      width: 80px; 
      height: 52px; 
    }

    .rank-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .rank-row { 
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 6px;
    }
    /* 【修改點】數字按鈕：加寬到 90px，高度壓平到 50px */
    .rank-row button { 
      font-size: 26px; 
      font-weight: bold;
      width: 90px;  
      height: 50px; 
    }

    /* ========== 24 格記牌區 ========== */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(6, 105px); /* 【修改點】格子寬度大幅拉長 */
      gap: 10px; 
      justify-content: center; 
      padding: 12px;
      background: #3a3f47;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5); 
    }
    
    .slot { 
      width: 105px;   
      height: 54px;  /* 【修改點】格子高度壓低，呈現扁平的長方形 */
      font-size: 28px;  
      border: 3px solid #555; 
      border-radius: 8px;
      background: #1e1e1e;
      color: #f0f0f0; 
      margin: 0; 
      font-weight: bold;
    }
    .slot[style*="color: red"] { color: #ff6b6b !important; }

    /* ========== 左右兩側功能按鈕 ========== */
    .main-area {
      display: flex;
      justify-content: center;
      align-items: flex-end; 
      margin: 20px auto 0px; 
      gap: 20px; 
      max-width: 940px; 
    }
    
    .left-sidebar-buttons, .right-sidebar-buttons { 
      display: flex; 
      flex-direction: column; 
      width: 105px; 
      gap: 8px;
    }

    /* 【修改點】側邊按鈕：壓低高度 */
    .clear-button { 
      font-size: 16px; 
      font-weight: bold;
      height: 60px;
      border-radius: 8px;
      color: white; 
      border: none;
      flex-direction: column; 
    }
    .clear-icon { font-size: 24px; margin-bottom: 2px; }
    
    .bookmark-button { background: #f1c40f; box-shadow: 0 4px 0 #d1ac0d; color: #333; }
    .bookmark-button:hover { background: #d1ac0d; transform: translateY(2px); box-shadow: 0 2px 0 #b3910c; }
    .bookmark-button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; background: #555 !important; }

    .clear-empty { background: #2ecc71; box-shadow: 0 4px 0 #27ae60; }
    .clear-empty:hover { background: #27ae60; transform: translateY(2px); box-shadow: 0 2px 0 #219d55; }

    .undo-button { background: #3498db; box-shadow: 0 4px 0 #2980b9; }
    .undo-button:hover { background: #2980b9; transform: translateY(2px); box-shadow: 0 2px 0 #2071a1; }
    
    .redo-button { background: #1abc9c; box-shadow: 0 4px 0 #16a085; }
    .redo-button:hover { background: #16a085; transform: translateY(2px); box-shadow: 0 2px 0 #148f77; }
  </style>
</head>
<body>

  <div id="app-container">
      <div class="top-alignment-wrapper">
          <div class="top-selection">
              <div class="top-left-col">
                  <button class="clear-all" onclick="clearAll()">
                      <span class="clear-icon">❌</span>
                      全部清除
                  </button>
              </div>

              <div class="selection-area">
                  <div class="suit-group">
                      <button onclick="selectSuit('♠')"><span class="suit-icon">♠</span></button>
                      <button class="red-text-suit" onclick="selectSuit('♥')"><span class="suit-icon">♥</span></button>
                      <button onclick="selectSuit('♧')"><span class="suit-icon">♧</span></button>
                      <button class="red-text-suit" onclick="selectSuit('♢')"><span class="suit-icon">♢</span></button>
                  </div>

                  <div class="rank-group">
                      <div class="rank-row">
                          <button onclick="selectRank('A')">A</button>
                          <button onclick="selectRank('2')">2</button>
                          <button onclick="selectRank('3')">3</button>
                          <button onclick="selectRank('4')">4</button>
                          <button onclick="selectRank('5')">5</button>
                      </div>
                      <div class="rank-row">
                          <button onclick="selectRank('6')">6</button>
                          <button onclick="selectRank('7')">7</button>
                          <button onclick="selectRank('8')">8</button>
                          <button onclick="selectRank('9')">9</button>
                          <button onclick="selectRank('10')">10</button>
                      </div>
                      <div class="rank-row">
                          <button onclick="selectRank('J')">J</button>
                          <button onclick="selectRank('Q')">Q</button>
                          <button onclick="selectRank('K')">K</button>
                      </div>
                  </div>
              </div>
              <div class="top-right-spacer"></div>
          </div>
      </div>
      
      <div class="main-area">
          <div class="left-sidebar-buttons">
              <button class="clear-button clear-empty" onclick="removeEmptySlots()">
                  <span class="clear-icon">🗑️</span>
                  清除空格
              </button>
              <button class="clear-button undo-button" onclick="undo()">
                  <span class="clear-icon">↶</span>
                  復原
              </button>
              <button class="clear-button redo-button" onclick="redo()">
                  <span class="clear-icon">↱</span>
                  反復原
              </button>
          </div>
          
          <div class="grid" id="slots"></div>

          <div class="right-sidebar-buttons">
              <button class="clear-button bookmark-button" onclick="saveBookmark()">
                  <span class="clear-icon">🔖</span>
                  紀錄
              </button>
              <button class="clear-button bookmark-button" id="loadBookmarkBtn" onclick="loadBookmark()">
                  <span class="clear-icon">🔙</span>
                  返回紀錄
              </button>
          </div>
      </div>
  </div>

  <script>
    // ========== 自動等比例放大與「強制預留留白」邏輯 ==========
    function adjustScale() {
        const container = document.getElementById('app-container');
        const targetWidth = 960; 
        const targetHeight = 480; 
        
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        
        const isPortrait = screenHeight > screenWidth;
        
        const logicalWidth = isPortrait ? screenHeight : screenWidth;
        const logicalHeight = isPortrait ? screenWidth : screenHeight;
        
        // 【修改點】X 軸保留 4% 空隙 (0.96)，Y 軸強制保留 14% 空隙 (0.86) 來創造上下留白，避免壓迫
        const scaleX = (logicalWidth * 0.96) / targetWidth;
        const scaleY = (logicalHeight * 0.86) / targetHeight;
        const scale = Math.min(scaleX, scaleY);
        
        if (isPortrait) {
            container.style.transform = `translate(-50%, -50%) rotate(90deg) scale(${scale})`;
        } else {
            container.style.transform = `translate(-50%, -50%) rotate(0deg) scale(${scale})`;
        }
    }

    window.addEventListener('resize', adjustScale);
    window.addEventListener('orientationchange', () => {
        adjustScale();
        setTimeout(adjustScale, 100);
        setTimeout(adjustScale, 300);
    });
    adjustScale();

    // ========== 記牌邏輯 ==========
    let selectedSuit = ''; 
    let selectedRank = '';
    let lastUsedSuit = '';
    let lastUsedRank = '';
    let history = [];
    let redoStack = []; 
    const MAX_HISTORY = 200; 
    let bookmarkState = null; 

    function getCurrentState() {
        const slots = document.querySelectorAll('.slot');
        return {
            slots: Array.from(slots).map(s => ({ content: s.innerText, color: s.style.color })),
            lastUsedSuit: lastUsedSuit,
            lastUsedRank: lastUsedRank
        };
    }

    function clearSelections() {
        selectedSuit = ''; 
        selectedRank = '';
        document.querySelectorAll('.rank-group button').forEach(btn => btn.classList.remove('selected'));
        document.querySelectorAll('.suit-group button').forEach(btn => btn.classList.remove('selected'));
    }

    function loadState(state) {
        const slots = document.querySelectorAll('.slot');
        if (state.slots.length !== slots.length) return; 
        slots.forEach((s, index) => {
            const item = state.slots[index];
            s.innerText = item.content;
            s.style.color = item.color || '#f0f0f0'; 
        });
        lastUsedSuit = state.lastUsedSuit || '';
        lastUsedRank = state.lastUsedRank || '';
        clearSelections(); 
    }

    function saveState() {
        const currentState = getCurrentState();
        if (history.length > 0) {
            const lastState = history[history.length - 1];
            if (JSON.stringify(lastState.slots) === JSON.stringify(currentState.slots) &&
                lastState.lastUsedSuit === currentState.lastUsedSuit &&
                lastState.lastUsedRank === currentState.lastUsedRank) return; 
        }
        if (history.length >= MAX_HISTORY) history.shift(); 
        history.push(currentState);
    }

    function undo() {
        if (history.length <= 1) return;
        const currentState = history.pop(); 
        redoStack.push(currentState);
        loadState(history[history.length - 1]);
    }

    function redo() {
        if (redoStack.length === 0) return;
        const nextState = redoStack.pop();
        loadState(nextState);
        history.push(nextState);
    }

    function updateBookmarkButtons() {
        const loadBtn = document.getElementById('loadBookmarkBtn');
        if (loadBtn) loadBtn.disabled = (bookmarkState === null);
    }

    function saveBookmark() { bookmarkState = getCurrentState(); updateBookmarkButtons(); }

    function loadBookmark() {
        if (bookmarkState === null) return;
        if (redoStack.length > 0) redoStack = []; 
        loadState(bookmarkState);
        saveState(); 
    }

    function selectSuit(suit) {
      document.querySelectorAll('.suit-group button').forEach(btn => btn.classList.remove('selected'));
      selectedSuit = suit;
      document.querySelectorAll('.suit-group button').forEach(btn => {
          if (btn.querySelector('.suit-icon') && btn.querySelector('.suit-icon').innerText.trim() === suit) btn.classList.add('selected');
      });
    }

    function selectRank(rank) {
      document.querySelectorAll('.rank-group button').forEach(btn => btn.classList.remove('selected'));
      selectedRank = rank;
      document.querySelectorAll('.rank-group button').forEach(btn => {
          if (btn.innerText.trim() === rank) btn.classList.add('selected');
      });
    }

    function fillSlot(btn) {
        if (redoStack.length > 0) redoStack = [];
        let suitToUse = selectedSuit;
        let rankToUse = selectedRank;

        if (suitToUse && !rankToUse) rankToUse = lastUsedRank;
        else if (!suitToUse && rankToUse) suitToUse = lastUsedSuit;
        
        const hasValidCardToFill = suitToUse && rankToUse;
        const isSlotFilled = btn.innerText !== '';

        if (!hasValidCardToFill) {
            if (isSlotFilled) { btn.innerText = ''; btn.style.color = '#f0f0f0'; saveState(); }
            return;
        }
        
        btn.innerText = suitToUse + rankToUse;
        btn.style.color = (suitToUse === '♥' || suitToUse === '♢') ? 'red' : '#f0f0f0'; 
        
        lastUsedSuit = suitToUse; lastUsedRank = rankToUse;
        selectedSuit = ''; selectedRank = '';
        saveState();
    }

    function clearAll() {
      if (confirm("確定要清除所有 24 個記牌槽、花色/數字選中狀態以及上次紀錄的延續記憶嗎？")) {
          if (redoStack.length > 0) redoStack = []; 
          document.querySelectorAll('.slot').forEach(s => { s.innerText = ''; s.style.color = '#f0f0f0'; });
          clearSelections(); lastUsedSuit = ''; lastUsedRank = '';
          saveState(); 
      }
    }

    function removeEmptySlots() {
      if (redoStack.length > 0) redoStack = []; 
      const slots = Array.from(document.querySelectorAll('.slot'));
      const nonEmpty = slots.filter(s => s.innerText !== '');
      const slotsContainer = document.getElementById('slots');
      
      slotsContainer.innerHTML = '';
      nonEmpty.forEach(s => slotsContainer.appendChild(s));
      
      const totalSlots = 24;
      for (let i = nonEmpty.length; i < totalSlots; i++) {
        let b = document.createElement('button');
        b.className = 'slot'; b.onclick = () => fillSlot(b);
        slotsContainer.appendChild(b);
      }
      saveState(); 
    }

    const slotsContainer = document.getElementById('slots');
    for (let i = 0; i < 24; i++) {
      let b = document.createElement('button');
      b.className = 'slot'; b.onclick = () => fillSlot(b);
      slotsContainer.appendChild(b);
    }

    window.onload = function() { saveState(); updateBookmarkButtons(); }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('ServiceWorker 註冊失敗: ', err));
      });
    }
  </script>

</body>
</html>
